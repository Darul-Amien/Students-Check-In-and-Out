<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Gerbang Pondok</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        #reader { width: 100%; border-radius: 5px; overflow: hidden; margin-bottom: 15px; }
        .result-box {
            padding: 15px;
            background: #e8f4fd;
            border-left: 5px solid #3498db;
            border-radius: 4px;
            margin-top: 15px;
            display: none;
        }
        .success { background: #d4edda; border-color: #28a745; color: #155724; }
        .error { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .loading-db { font-size: 13px; color: #e67e22; margin-bottom: 10px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Absensi Gerbang Pondok</h2>
    
    <div id="dbStatus" class="loading-db">Memuat database santri dari Google Sheets...</div>

    <div class="form-group">
        <label for="pencatat">Nama Petugas / Penjaga:</label>
        <select id="pencatat">
            <option value="">-- Pilih Nama Petugas --</option>
            <option value="Ustadz Ahmad Rifani">Ustadz Ahmad Rifani</option>
            <option value="Ustadz Pengabdian">Ustadz Pengabdian</option>
            <option value="Ustadz Keamanan">Ustadz Keamanan</option>
            <option value="ustadzha Pengabdian">Ustadzah Pengabdian</option>
        </select>
    </div>

    <div class="form-group">
        <label for="status">Status Kehadiran:</label>
        <select id="status">
            <option value="Masuk">Masuk ke Pondok</option>
            <option value="Keluar">Keluar dari Pondok</option>
        </select>
    </div>

    <label>Scan QR Code Kartu Santri:</label>
    <div id="reader"></div>

    <div id="resultBox" class="result-box">
        <strong>Status Terakhir:</strong>
        <p id="resultText">Belum ada scan.</p>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx9k5HqsJDbDkd5jVhJL8tOALlWTV-m_3D37JzDLCy1i6KRaFwES640Ja3DXO1xFSlLTg/exec";

    let databaseSantri = {};

    fetch(WEB_APP_URL)
        .then(response => response.json())
        .then(data => {
            data.forEach(item => {
                databaseSantri[item.id] = item.nama;
            });
            document.getElementById("dbStatus").style.display = "none";
        })
        .catch(error => {
            document.getElementById("dbStatus").innerText = "Gagal memuat database santri!";
            document.getElementById("dbStatus").style.color = "red";
        });

    let lastScannedId = "";
    let lastScanTime = 0;

    function onScanSuccess(decodedText, decodedResult) {
        const currentTime = new Date().getTime();
        let cleanId = String(decodedText).trim();
        
        if (cleanId === lastScannedId && (currentTime - lastScanTime < 3000)) {
            return;
        }
        
        lastScannedId = cleanId;
        lastScanTime = currentTime;

        // Pencarian fleksibel untuk mencocokkan ID dari database Sheet2
        let matchedKey = Object.keys(databaseSantri).find(k => k.trim() === cleanId);
        let namaSantri = matchedKey ? databaseSantri[matchedKey] : null;
        
        if (!namaSantri) {
            showResult(`ID "${cleanId}" tidak ditemukan di database!`, "error");
            return;
        }

        let status = document.getElementById("status").value;
        let pencatat = document.getElementById("pencatat").value;

        if (!pencatat) {
            showResult("Harap pilih Nama Petugas terlebih dahulu!", "error");
            return;
        }

        showResult(`Mengirim data: ${namaSantri} (${status})...`, "");

        const dataToSend = {
            idSantri: cleanId,
            nama: namaSantri,
            status: status,
            pencatat: pencatat
        };

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dataToSend)
        })
        .then(() => {
            showResult(`BERHASIL! <br><b>${namaSantri}</b> tercatat <b>${status}</b>.`, "success");
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(200);
            }
        })
        .catch(error => {
            showResult(`Gagal mengirim data: ${error}`, "error");
        });
    }

    function showResult(message, type) {
        const box = document.getElementById("resultBox");
        const text = document.getElementById("resultText");
        box.style.display = "block";
        box.className = "result-box " + type;
        text.innerHTML = message;
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
