<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Massal Kartu Santri & QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2, h3 { text-align: center; color: #2c3e50; }
        .form-group {
            margin-bottom: 15px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
        }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:hover { background-color: #219653; }
        .btn-template { background-color: #e67e22; }
        .btn-template:hover { background-color: #d35400; }
        .btn-print { background-color: #2980b9; }
        .btn-print:hover { background-color: #2471a3; }

        #cardsWrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: center;
            margin-top: 20px;
        }
        
        /* Desain Kartu Santri Modern dengan Watermark Menyeluruh */
        .card-preview {
            width: 340px;
            height: 210px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px 14px;
            background: linear-gradient(135deg, #ffffff 0%, #f4fbf7 100%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            page-break-inside: avoid;
            break-inside: avoid;
            position: relative;
            overflow: hidden;
        }

        /* Efek Watermark Menyeluruh Menutupi Seluruh Kartu */
        .card-preview::after {
            content: "KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN • KEMADRASAHAN •";
            position: absolute;
            top: -50px;
            left: -50px;
            right: -50px;
            bottom: -50px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 10px;
            font-weight: bold;
            color: rgba(39, 174, 96, 0.08);
            line-height: 1.5;
            letter-spacing: 3px;
            transform: rotate(-15deg);
            z-index: 0;
            pointer-events: none;
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Memastikan konten kartu berada di atas watermark */
        .card-header, .card-body {
            position: relative;
            z-index: 1;
        }

        /* Garis aksen tipis di sisi kiri kartu */
        .card-preview::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 5px;
            background-color: #27ae60;
            z-index: 2;
        }

        .card-header {
            display: flex;
            align-items: center;
            border-bottom: 1.5px solid #e2e8f0;
            padding-bottom: 6px;
            margin-left: 4px;
        }
        .card-logo {
            width: 36px;
            height: 36px;
            object-fit: contain;
            margin-right: 10px;
        }
        .pondok-title {
            font-size: 11.5px;
            font-weight: 800;
            color: #1e3a8a;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1.1;
        }
        .pondok-sub {
            font-size: 7px;
            color: #64748b;
            font-weight: 600;
            margin-top: 1px;
        }
        
        .card-body {
            display: flex;
            justify-content: space-between;
            align-items: center; /* Diubah agar posisi vertikal pas di tengah */
            flex: 1;
            margin-top: 4px;
            margin-left: 4px;
        }
        .card-left { width: 57%; }
        .santri-name { font-size: 15.5px; font-weight: bold; color: #0f172a; margin-bottom: 6px; line-height: 1.2; }
        .santri-detail { font-size: 11.5px; color: #334155; margin-bottom: 8px; }
        .card-notes { 
            font-size: 6px; 
            color: #475569; 
            margin-top: 8px; 
            line-height: 1.35; 
            border-top: 1px dashed #cbd5e1;
            padding-top: 4px;
        }
        
        .card-right { width: 41%; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card-right canvas { width: 92px !important; height: 92px !important; border-radius: 6px; background: #fff; padding: 2px; border: 1px solid #e2e8f0; }
        .qr-id { font-size: 9.5px; font-weight: bold; color: #1e293b; margin-top: 4px; letter-spacing: 0.5px; }

        @media print {
            body { background: none; padding: 0; }
            .container > *:not(#cardsWrapper) { display: none; }
            #cardsWrapper { gap: 8px; }
            .card-preview { border: 1px solid #94a3b8; box-shadow: none; margin: 4px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Generator Kartu Santri & QR Code</h2>
    
    <div class="form-group">
        <label>Pengaturan Identitas Pesantren:</label>
        <label for="namaPesantrenInput" style="font-size: 13px; font-weight: normal;">Nama Pesantren:</label>
        <input type="text" id="namaPesantrenInput" value="Pondok Pesantren Darul Amien" placeholder="Masukkan nama pesantren...">
    </div>

    <div class="form-group">
        <label>Langkah 1: Download & Isi Template Excel</label>
        <button class="btn-template" onclick="downloadTemplate()">Download Template Excel (.xlsx)</button>
    </div>

    <div class="form-group">
        <label for="excelFile">Langkah 2: Upload File Excel Santri</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="handleExcelUpload(event)">
    </div>

    <button class="btn-print" onclick="window.print()">Cetak Semua Kartu (Print)</button>

    <h3>Pratinjau Kartu</h3>
    <div id="cardsWrapper">
        <p style="text-align: center; color: #777;">Silakan upload file Excel data santri untuk melihat pratinjau kartu.</p>
    </div>
</div>

<script>
    const FIXED_LOGO_URL = "https://lh3.googleusercontent.com/d/1dvYhUaUyFGMoInZlAyo25nxZDNmD6o9W";

    function downloadTemplate() {
        const templateData = [
            { id_santri: "23-1172", nama: "Ahmad Bushiri", kelas: "Kelas 4A" },
            { id_santri: "23-1127", nama: "Ahmad Fitra Ramadhan", kelas: "Kelas 4A" }
        ];
        const worksheet = XLSX.utils.json_to_sheet(templateData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Data Santri");
        XLSX.writeFile(workbook, "Template_Kartu_Santri.xlsx");
    }

    function handleExcelUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const santriDataList = XLSX.utils.sheet_to_json(worksheet);
            
            displayCards(santriDataList);
        };
        reader.readAsArrayBuffer(file);
    }

    function displayCards(data) {
        const wrapper = document.getElementById('cardsWrapper');
        wrapper.innerHTML = '';

        let namaPesantren = document.getElementById('namaPesantrenInput').value;

        if (data.length === 0) {
            wrapper.innerHTML = '<p style="text-align: center; color: red;">File kosong atau format kolom tidak dikenali!</p>';
            return;
        }

        data.forEach((item, index) => {
            let id = String(item.id_santri || item.ID || item.id || `SANTRI-${index+1}`).trim();
            let nama = String(item.nama || item.Nama || 'Tanpa Nama').trim();

            let cardDiv = document.createElement('div');
            cardDiv.className = 'card-preview';
            cardDiv.innerHTML = `
                <div class="card-header">
                    <img src="${FIXED_LOGO_URL}" class="card-logo" onerror="this.style.display='none'">
                    <div>
                        <div class="pondok-title">${namaPesantren}</div>
                        <div class="pondok-sub">Desa Teluk Labak Kec. Daha Utara Kab. Hulu Sungai Selatan</div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="card-left">
                        <div class="santri-name">${nama}</div>
                        <div class="santri-detail"><b>ID:</b> ${id}</div>
                        <div class="card-notes">
                            * Kartu ini berfungsi sebagai Kartu Santri<br>
                            ** Kartu ini berfungsi sebagai Kartu Peserta Ujian<br>
                            *** Kartu ini berfungsi sebagai Kartu Scan Kehadiran
                        </div>
                    </div>
                    <div class="card-right">
                        <canvas id="qr-${index}"></canvas>
                        <div class="qr-id">${id}</div>
                    </div>
                </div>
            `;
            wrapper.appendChild(cardDiv);

            new QRious({
                element: document.getElementById(`qr-${index}`),
                size: 100,
                value: id
            });
        });
    }
</script>

</body>
</html>
