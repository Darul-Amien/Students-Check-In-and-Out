<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner QR Code Absensi Santri</title>
    <!-- Memuat library Html5Qrcode Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
            box-sizing: border-box;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #ddd;
            margin-bottom: 15px;
        }
        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            display: none;
        }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .loading-db {
            text-align: center;
            font-style: italic;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Scanner Gerbang Pondok</h2>
    
    <div id="dbStatus" class="loading-db">Memuat database master santri...</div>

    <div class="form-group">
        <label for="petugas">Nama Petugas Penjaga:</label>
        <input type="text" id="petugas" placeholder="Masukkan nama Anda..." value="Admin Gerbang">
    </div>

    <div class="form-group">
        <label for="statusScan">Pilih Status Kehadiran:</label>
        <select id="statusScan">
            <option value="Masuk">Masuk ke Pondok (🏫)</option>
            <option value="Keluar">Keluar dari Pondok (🚶‍♂️)</option>
        </select>
    </div>

    <!-- Area Kamera Scanner -->
    <div id="reader"></div>

    <!-- Notifikasi Hasil Scan -->
    <div id="alertBox" class="alert"></div>
</div>

<script>
    // URL Web App Google Apps Script Anda
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx9k5HqsJDbDkd5jVhJL8tOALlWTV-m_3D37JzDLCy1i6KRaFwES640Ja3DXO1xFSlLTg/exec";
    
    let listMasterSantri = [];
    let isProcessing = false;

    // 1. Fungsi Text-to-Speech untuk suara "Terima kasih" di HP/Laptop
    function ucapkanTerimaKasih(namaSantri) {
        if ('speechSynthesis' in window) {
            // Anda bisa menggunakan teks statis "Terima kasih" atau digabung dengan nama santri
            let text = "Terima kasih, " + namaSantri;
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID'; // Mengatur bahasa ke Bahasa Indonesia
            utterance.rate = 1.0;     // Kecepatan normal
            window.speechSynthesis.speak(utterance);
        }
    }

    // 2. Ambil data master santri dari GAS saat halaman dibuka
    async function loadMasterSantri() {
        try {
            let response = await fetch(WEB_APP_URL);
            listMasterSantri = await response.json();
            document.getElementById("dbStatus").style.display = "none";
        } catch (error) {
            console.error(error);
            document.getElementById("dbStatus").innerText = "Gagal memuat database santri. Periksa koneksi/URL.";
            document.getElementById("dbStatus").style.color = "red";
        }
    }

    // 3. Fungsi yang dieksekusi saat kamera berhasil membaca QR Code
    async function onScanSuccess(decodedText) {
        if (isProcessing) return; // Mencegah scan ganda berturut-turut
        isProcessing = true;

        let idSantriScan = decodedText.trim();
        let petugas = document.getElementById("petugas").value.trim();
        let statusDipilih = document.getElementById("statusScan").value;

        if (!petugas) {
            showAlert("Nama petugas belum diisi!", "error");
            isProcessing = false;
            return;
        }

        // Mencari data santri berdasarkan ID di array master (mendukung properti id atau id_santri)
        let santri = listMasterSantri.find(s => String(s.id_santri || s.id).trim() === idSantriScan);

        if (!santri) {
            showAlert(`Database tidak ditemukan! ID: ${idSantriScan} tidak terdaftar.`, "error");
            setTimeout(() => { isProcessing = false; }, 3000);
            return;
        }

        showAlert(`Memproses absensi untuk ${santri.nama}...`, "success");

        // Kirim data via POST ke Google Apps Script
        try {
            let payload = {
                idSantri: santri.id_santri || santri.id,
                nama: santri.nama,
                status: statusDipilih,
                pencatat: petugas
            };

            let response = await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });

            let result = await response.json();

            if (result.result === "success") {
                showAlert(`✅ BERHASIL: ${santri.nama} (${statusDipilih})`, "success");
                
                // Memanggil suara konfirmasi otomatis
                ucapkanTerimaKasih(santri.nama);
            } else {
                showAlert(`❌ GAGAL: ${result.message}`, "error");
            }
        } catch (error) {
            console.error(error);
            showAlert("Terjadi kesalahan koneksi ke server.", "error");
        }

        // Jeda waktu sebelum scanner aktif membaca kembali
        setTimeout(() => {
            isProcessing = false;
            hideAlert();
        }, 3500);
    }

    function showAlert(message, type) {
        let alertBox = document.getElementById("alertBox");
        alertBox.innerText = message;
        alertBox.className = "alert " + (type === "success" ? "alert-success" : "alert-error");
        alertBox.style.display = "block";
    }

    function hideAlert() {
        document.getElementById("alertBox").style.display = "none";
    }

    // Jalankan pemuatan data master
    loadMasterSantri();

    // Inisialisasi kamera scanner QR
    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: 250 }, false
    );
    html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
