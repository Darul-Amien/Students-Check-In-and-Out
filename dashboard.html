<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Santri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #2c3e50; }
        .stats-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            color: white;
            text-align: center;
        }
        .card-inside { background-color: #27ae60; }
        .card-outside { background-color: #e67e22; }
        .stat-number { font-size: 24px; font-weight: bold; margin-top: 5px; }
        
        .filter-section {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .filter-section select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .loading { text-align: center; color: #7f8c8d; font-style: italic; margin: 20px 0; }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-inside { background-color: #27ae60; }
        .badge-outside { background-color: #e67e22; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dashboard Monitoring Gerbang Pondok</h2>
    
    <div class="stats-box">
        <div class="stat-card card-inside">
            <div>Status: Di Dalam Pondok</div>
            <div id="countInside" class="stat-number">0</div>
        </div>
        <div class="stat-card card-outside">
            <div>Status: Di Luar Pondok</div>
            <div id="countOutside" class="stat-number">0</div>
        </div>
    </div>

    <div class="filter-section">
        <h3 id="tableTitle" style="margin: 0; font-size: 16px; color: #2c3e50;">Daftar Status Santri</h3>
        <div>
            <label for="statusFilter" style="font-size: 14px; font-weight: bold; margin-right: 5px;">Filter:</label>
            <select id="statusFilter" onchange="renderTable()">
                <option value="Keluar">Di Luar Pondok</option>
                <option value="Masuk">Di Dalam Pondok</option>
                <option value="Semua">Semua Santri</option>
            </select>
        </div>
    </div>

    <div id="loadingText" class="loading">Memuat data aktivitas...</div>
    
    <table id="mainTable" style="display: none;">
        <thead>
            <tr>
                <th>ID Santri</th>
                <th>Nama Santri</th>
                <th>Status Terakhir</th>
                <th>Waktu Aktivitas</th>
                <th>Petugas</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Data masuk otomatis -->
        </tbody>
    </table>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx9k5HqsJDbDkd5jVhJL8tOALlWTV-m_3D37JzDLCy1i6KRaFwES640Ja3DXO1xFSlLTg/exec";
    
    let globalSantriData = [];

    function loadDashboardData() {
        fetch(WEB_APP_URL + "?action=logs")
            .then(response => response.json())
            .then(logs => {
                let statusTerakhirSantri = {};

                // Petakan status terakhir setiap santri
                logs.forEach(log => {
                    statusTerakhirSantri[log.id] = {
                        id: log.id,
                        nama: log.nama,
                        status: log.status,
                        waktu: log.waktu,
                        pencatat: log.pencatat
                    };
                });

                globalSantriData = [];
                let insideCount = 0;
                let outsideCount = 0;

                for (let id in statusTerakhirSantri) {
                    let data = statusTerakhirSantri[id];
                    globalSantriData.push(data);
                    if (data.status === "Keluar") {
                        outsideCount++;
                    } else {
                        insideCount++;
                    }
                }

                // Update angka kartu statistik
                document.getElementById("countInside").innerText = insideCount;
                document.getElementById("countOutside").innerText = outsideCount;

                document.getElementById("loadingText").style.display = "none";
                document.getElementById("mainTable").style.display = "table";

                // Render tabel sesuai pilihan filter saat ini
                renderTable();
            })
            .catch(error => {
                document.getElementById("loadingText").innerText = "Gagal memuat data dashboard.";
                document.getElementById("loadingText").style.color = "red";
            });
    }

    function renderTable() {
        let filterValue = document.getElementById("statusFilter").value;
        let tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        let filteredData = globalSantriData.filter(item => {
            if (filterValue === "Semua") return true;
            return item.status === filterValue;
        });

        if (filteredData.length > 0) {
            filteredData.forEach(item => {
                let badgeClass = item.status === "Keluar" ? "badge-outside" : "badge-inside";
                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${item.id || '-'}</td>
                    <td><b>${item.nama}</b></td>
                    <td><span class="badge ${badgeClass}">${item.status}</span></td>
                    <td>${new Date(item.waktu).toLocaleString('id-ID')}</td>
                    <td>${item.pencatat}</td>
                `;
                tbody.appendChild(tr);
            });
        } else {
            let tr = document.createElement("tr");
            tr.innerHTML = `<td colspan="5" style="text-align: center; color: #7f8c8d; font-style: italic;">Tidak ada data untuk kategori ini.</td>`;
            tbody.appendChild(tr);
        }
    }

    // Muat data saat halaman dibuka & refresh otomatis setiap 10 detik
    loadDashboardData();
    setInterval(loadDashboardData, 10000);
</script>

</body>
</html>
