<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Santri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #2c3e50; }
        .stats-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            color: white;
            text-align: center;
        }
        .card-inside { background-color: #27ae60; }
        .card-outside { background-color: #e67e22; }
        .stat-number { font-size: 24px; font-weight: bold; margin-top: 5px; }
        
        .filter-section {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .filter-section select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .loading { text-align: center; color: #7f8c8d; font-style: italic; margin: 20px 0; }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-inside { background-color: #27ae60; }
        .badge-outside { background-color: #e67e22; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dashboard Monitoring Gerbang Pondok</h2>
    
    <div class="stats-box">
        <div class="stat-card card-inside">
            <div>Status: Di Dalam Pondok</div>
            <div id="countInside" class="stat-number">0</div>
        </div>
        <div class="stat-card card-outside">
            <div>Status: Di Luar Pondok</div>
            <div id="countOutside" class="stat-number">0</div>
        </div>
    </div>

    <div class="filter-section">
        <h3 style="margin: 0; font-size: 16px; color: #2c3e50;">Daftar Status Seluruh Santri</h3>
        <div>
            <label for="statusFilter" style="font-size: 14px; font-weight: bold; margin-right: 5px;">Filter:</label>
            <select id="statusFilter" onchange="renderTable()">
                <option value="Semua">Semua Santri</option>
                <option value="Masuk">Di Dalam Pondok</option>
                <option value="Keluar">Di Luar Pondok</option>
            </select>
        </div>
    </div>

    <div id="loadingText" class="loading">Memuat data master santri & aktivitas...</div>
    
    <table id="mainTable" style="display: none;">
        <thead>
            <tr>
                <th>ID Santri</th>
                <th>Nama Santri</th>
                <th>Kelas</th>
                <th>Status Terakhir</th>
                <th>Waktu Aktivitas</th>
                <th>Petugas</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Data masuk otomatis -->
        </tbody>
    </table>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx9k5HqsJDbDkd5jVhJL8tOALlWTV-m_3D37JzDLCy1i6KRaFwES640Ja3DXO1xFSlLTg/exec";
    
    let globalSantriData = [];

    async function loadDashboardData() {
        try {
            // 1. Ambil data master seluruh santri dari Database_Santri
            let resSantri = await fetch(WEB_APP_URL);
            let listSantri = await resSantri.json();

            // 2. Ambil data riwayat log absensi dari Log_Check_in
            let resLogs = await fetch(WEB_APP_URL + "?action=logs");
            let logs = await resLogs.json();

            let statusTerakhirMap = {};
            logs.forEach(log => {
                // Menyesuaikan dengan kunci log ("ID Santri" atau "id_santri" tergantung dari Apps Script Anda)
                let santriId = log.id_santri || log.id || log["ID Santri"];
                statusTerakhirMap[santriId] = {
                    status: log.status || log.Status,
                    waktu: log.waktu || log.Waktu,
                    pencatat: log.pencatat || log.Pencatat
                };
            });

            globalSantriData = [];
            let insideCount = 0;
            let outsideCount = 0;

            listSantri.forEach(santri => {
                let sId = santri.id_santri || santri.id;
                let lastLog = statusTerakhirMap[sId];
                
                let statusTerakhir = lastLog ? lastLog.status : "Masuk";
                let waktuAktivitas = lastLog && lastLog.waktu ? new Date(lastLog.waktu).toLocaleString('id-ID') : "Belum pernah scan";
                let pencatat = lastLog ? lastLog.pencatat : "-";
                let kelasSantri = santri.kelas || "-";

                if (statusTerakhir === "Masuk") {
                    insideCount++;
                } else {
                    outsideCount++;
                }

                globalSantriData.push({
                    id: sId,
                    nama: santri.nama || santri.Nama,
                    kelas: kelasSantri,
                    status: statusTerakhir,
                    waktu: waktuAktivitas,
                    pencatat: pencatat
                });
            });

            document.getElementById("countInside").innerText = insideCount;
            document.getElementById("countOutside").innerText = outsideCount;

            document.getElementById("loadingText").style.display = "none";
            document.getElementById("mainTable").style.display = "table";

            renderTable();
        } catch (error) {
            console.error(error);
            document.getElementById("loadingText").innerText = "Gagal memuat data dashboard.";
            document.getElementById("loadingText").style.color = "red";
        }
    }

    function renderTable() {
        let filterValue = document.getElementById("statusFilter").value;
        let tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        let filteredData = globalSantriData.filter(item => {
            if (filterValue === "Semua") return true;
            return item.status === filterValue;
        });

        if (filteredData.length > 0) {
            filteredData.forEach(item => {
                let badgeClass = item.status === "Keluar" ? "badge-outside" : "badge-inside";
                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${item.id || '-'}</td>
                    <td><b>${item.nama}</b></td>
                    <td>${item.kelas}</td>
                    <td><span class="badge ${badgeClass}">${item.status}</span></td>
                    <td>${item.waktu}</td>
                    <td>${item.pencatat}</td>
                `;
                tbody.appendChild(tr);
            });
        } else {
            let tr = document.createElement("tr");
            tr.innerHTML = `<td colspan="6" style="text-align: center; color: #7f8c8d; font-style: italic;">Tidak ada data untuk kategori ini.</td>`;
            tbody.appendChild(tr);
        }
    }

    loadDashboardData();
    setInterval(loadDashboardData, 10000);
</script>

</body>
</html>
